[project]
site_name = "Deep Dives Hub"
repo_url = "https://github.com/tomstocks-ai/deep-dives-hub"
site_url = "https://tomstocks-ai.github.io/deep-dives-hub/"
site_description = "Collaborative stock deep-dive research — readable summaries for humans, JSON API for agents."
site_author = "AAA Support"
copyright = "&copy; 2026 AAA Support — Deep Dives Hub"
docs_dir = "docs"
extra_javascript = [
    "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js",
    "javascripts/tablesort.js"
]

# Top-level tabs are kept short and scannable. The 10 investment themes are
# grouped under a single "Themes" tab (a dropdown/section) so the header no
# longer overflows with a dozen crowded tabs.
nav = [
  { "Home" = "index.md" },
  { "All Stocks" = "table.md" },
  { "Themes" = [
    { "AI Buildout" = "deep-dives/AI_buildout.md" },
    { "Software & Cybersecurity" = "deep-dives/software.md" },
    { "Energy & Power" = "deep-dives/energy.md" },
    { "Defense" = "deep-dives/defense.md" },
    { "Space" = "deep-dives/space.md" },
    { "Quantum Computing" = "deep-dives/quantum-computing.md" },
    { "Critical Minerals" = "deep-dives/critical-minerals.md" },
    { "Biotech & Health" = "deep-dives/biotech-health.md" },
    { "Fintech" = "deep-dives/fintech.md" },
    { "eVTOL & Air Mobility" = "deep-dives/evtol.md" },
  ] },
  { "API Reference" = "api-docs.md" },
]

[project.theme]
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "navigation.tracking",
  "toc.follow",
  "search.suggest",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "material/chart-line"

extra_css = ["stylesheets/extra.css"]
